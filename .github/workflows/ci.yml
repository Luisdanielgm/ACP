name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/hub/frontend/package-lock.json

      - name: Build managed SPA (route-baseline test needs the mounted dist)
        working-directory: apps/hub/frontend
        run: |
          npm ci || npm install
          npm run build
          npm test

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/hub/pyproject.toml

      - name: Install hub (with test extras)
        run: pip install -e "apps/hub[test]"

      - name: Lint (correctness rules)
        run: |
          pip install "ruff>=0.6"
          ruff check --config apps/hub/pyproject.toml apps ACP_AGENT tests

      - name: Run test suite
        run: python -m pytest tests/ -q

  docker-smoke:
    name: docker compose boots and answers /health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate env file
        run: |
          pip install -e apps/hub
          python -m acp_managed.setup init-single-workspace \
            --env-file apps/hub/.env \
            --workspace-name "CI Workspace" \
            --workspace-slug default \
            --admin-email ci@example.com \
            --admin-password "ci-only-password-123"

      - name: Build and start the hub
        working-directory: apps/hub
        run: docker compose up -d --build

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          docker compose -f apps/hub/docker-compose.yml logs
          exit 1

      - name: Tear down
        if: always()
        working-directory: apps/hub
        run: docker compose down -v
